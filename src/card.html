<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Gera as imagens do README. Uso: card.html#banner-light, card.html#sanjes-dark etc. -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  :root { --bg: #f1ece2; --dots: #d9d0bf; --ink: #141311; --ink2: #4a4640; --ink3: #7c766c; --pen: #2140d9; --line: #d6cdbb; --chip: #e7e0d2; }
  .dark { --bg: #0d1117; --dots: #1f2630; --ink: #f1ece2; --ink2: #b9b3a8; --ink3: #8b857b; --pen: #8fa2ff; --line: #2a313c; --chip: #1a2029; }
  html, body { background: transparent; }
  body { font-family: 'Inter Tight', sans-serif; }
  .frame {
    position: relative; overflow: hidden; border-radius: 22px; background: var(--bg); color: var(--ink);
    background-image: radial-gradient(var(--dots) 1.3px, transparent 1.3px); background-size: 26px 26px;
  }
  .mono { font: 500 19px 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
  .pen { color: var(--pen); }

  /* banner */
  .banner { width: 1280px; height: 400px; padding: 64px 72px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark { width: 54px; height: 54px; border-radius: 14px; background: #141311; position: relative; rotate: -3deg; flex: none; }
  .dark .mark { box-shadow: 0 0 0 1px #2a313c; }
  .mark b { position: absolute; inset: 0; display: grid; place-items: center; padding-bottom: 6px; font: italic 400 40px/1 'Instrument Serif', serif; color: #f1ece2; }
  .mark svg { position: absolute; left: 11px; bottom: 10px; width: 32px; height: 6px; overflow: visible; }
  .mark path { fill: none; stroke: #4d68ff; stroke-width: 2.4; stroke-linecap: round; }
  .banner h1 { margin-top: 70px; font: 400 128px/0.95 'Instrument Serif', serif; letter-spacing: -.025em; }
  .banner h1 em { color: var(--pen); }
  .banner p { margin-top: 22px; font: 500 26px/1.35 'Inter Tight'; color: var(--ink2); }
  .banner p b { color: var(--ink); font-weight: 700; }
  .note {
    position: absolute; right: 64px; top: 92px; width: 330px; padding: 22px 24px 24px; rotate: 3deg;
    background: #fbf8f2; color: #1c3fd0; border-radius: 4px; box-shadow: 0 22px 40px -22px rgba(0,0,0,.45);
    font: 600 40px/1.05 'Caveat', cursive;
  }
  .dark .note { background: #f1ece2; }
  .note::before { content: ''; position: absolute; top: -12px; left: 50%; translate: -50% 0; rotate: -4deg; width: 96px; height: 24px; background: rgba(250, 226, 140, .85); }
  .note small { display: block; margin-bottom: 8px; font: 500 12px 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: #7c766c; }

  /* cards de projeto */
  .card { width: 1280px; height: 240px; padding: 44px 64px; display: grid; grid-template-columns: 120px 1fr auto; gap: 40px; align-items: center; }
  .idx { font: italic 400 140px/0.8 'Instrument Serif', serif; color: var(--pen); }
  .card h2 { margin: 14px 0 0; font: 400 92px/0.95 'Instrument Serif', serif; letter-spacing: -.02em; }
  .card p { font: 500 24px/1.4 'Inter Tight'; color: var(--ink2); max-width: 820px; }
  .side { display: grid; justify-items: end; gap: 14px; align-self: stretch; align-content: space-between; }
  .chips { display: flex; gap: 8px; }
  .chip { font: 500 20px 'JetBrains Mono', monospace; padding: 8px 12px; border-radius: 999px; background: var(--chip); color: var(--ink2); }
  .status { font: 600 38px 'Caveat', cursive; color: var(--pen); rotate: -3deg; }
  .go { font: 600 20px 'Inter Tight'; color: var(--ink); display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--pen); padding-bottom: 4px; }
</style>
</head>
<body>
<div id="out"></div>
<script>
  const projects = {
    sanjes: { n: '01', name: 'Sanjes', cat: 'Sistema de gestão · Construção civil',
      text: 'Cronograma, produção, recursos e suprimentos de várias obras em um só lugar, do canteiro ao financeiro.',
      chips: ['Next.js'], go: 'Acessar o sistema' },
    linko: { n: '02', name: 'Linko', cat: 'Produto digital · Rede social',
      text: 'Uma rede de recomendações de filmes, livros, jogos e músicas em que cada indicação vem com opinião, nota e contexto.',
      chips: ['Next.js'], status: 'no ar, com usuários', go: 'linkosocial.com' },
    fibrolink: { n: '03', name: 'FibroLink', cat: 'Saúde · Iniciação científica',
      text: 'O paciente com fibromialgia registra dor, sono e fadiga em segundos, e o profissional acompanha a evolução entre as consultas.',
      chips: ['Vite', 'Firebase'], status: 'protótipo de pesquisa', go: 'Ver o protótipo' },
    videos: { n: '04', name: 'Vídeos por tema', cat: 'Plataforma de conteúdo · Projeto para cliente',
      text: 'Uma série de vídeos curtos organizada por assunto, com página própria para cada tema e QR codes para materiais impressos.',
      chips: [], status: 'projeto de cliente', go: '' },
  };
  const [id, theme] = location.hash.slice(1).split('-');
  document.body.className = theme === 'dark' ? 'dark' : '';
  const mark = '<div class="mark"><b>b</b><svg viewBox="0 0 32 6"><path d="M1 4.5 C 10 1.5, 22 1.5, 31 3.5"/></svg></div>';
  const out = document.getElementById('out');
  if (id === 'banner') {
    out.innerHTML = `<div class="frame banner">
      <div class="brand">${mark}<span class="mono">Ciência da Computação · UFS · Sergipe</span></div>
      <h1>Oi, eu sou o <em>Breno</em>.</h1>
      
      <div class="note"><small>Como eu trabalho</small>me conta o problema.<br>eu construo a ferramenta.</div>
    </div>`;
  } else {
    const p = projects[id];
    out.innerHTML = `<div class="frame card">
      <span class="idx">${p.n}</span>
      <div><span class="mono">${p.cat}</span><h2>${p.name}</h2></div>
      <div class="side">
        <div class="chips">${p.chips.map((c) => `<span class="chip">${c}</span>`).join('')}</div>
        ${p.status ? `<span class="status">${p.status}</span>` : '<span></span>'}
      </div>
    </div>`;
  }
</script>
</body>
</html>
